<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101935"/>
      <stop offset="1" stop-color="#05070F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <!-- the real frames behind, the generated frame in front -->
  <rect x="196" y="300" width="420" height="300" rx="44" fill="none" stroke="#5B6B9A" stroke-opacity="0.55" stroke-width="22"/>
  <rect x="300" y="384" width="420" height="300" rx="44" fill="none" stroke="#7C8DBF" stroke-opacity="0.75" stroke-width="22"/>
  <rect x="408" y="468" width="420" height="300" rx="44" fill="url(#accent)"/>
  <!-- forward chevrons on the generated frame -->
  <path d="M532 548 L612 618 L532 688" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M632 548 L712 618 L632 688" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
